# Save as .github/workflows/build-apk.yml in your fork.
# Commit your MainHook.java edits before running this workflow.
# Versions the APK as 1.1.<run number>; downloads are raw APKs, not ZIP files.
# Caches only the JDK and a dedicated Android SDK directory across runs.
# Requires repository secrets MODULE_KEYSTORE_B64 and MODULE_KS_PASS.
# Reuses your persistent signing key (PKCS12, alias dsh) so later APKs can update in place.
# Never caches or uploads the signing key; keep an offline backup.
# Build process: https://github.com/cmyfqwq/webauthn-for-webview-shells/blob/master/build.ps1
name: Build downloadable APK

# Manual invocation only: no push, pull_request, or schedule triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out your committed changes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check signing secrets are configured
        env:
          MODULE_KEYSTORE_B64: ${{ secrets.MODULE_KEYSTORE_B64 }}
          MODULE_KS_PASS: ${{ secrets.MODULE_KS_PASS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MODULE_KEYSTORE_B64) -or
              [string]::IsNullOrWhiteSpace($env:MODULE_KS_PASS)) {
            throw 'Add repository Actions secrets MODULE_KEYSTORE_B64 and MODULE_KS_PASS. A new key will NOT be generated automatically.'
          }

      - name: Initialize Android SDK location
        run: |
          # Runner environment variables are available inside a running step.
          # GITHUB_ENV exports these values to all subsequent steps/actions.
          $sdk = Join-Path $env:RUNNER_TEMP 'webauthn-android-sdk'
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache-jdk: true

      - name: Restore Android SDK cache
        id: android-sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          # Bump v1 to force a refresh. Change this key when changing SDK versions.
          key: ${{ runner.os }}-${{ runner.arch }}-android-cmdline12266719-api36-bt35.0.0-v1

      - name: Install Android SDK on cache miss
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v4
        with:
          # Command-line tools 16.0; compatible with the Java 17 toolchain.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Validate Android SDK
        run: |
          $required = @(
            'platforms/android-36/android.jar',
            'build-tools/35.0.0/aapt2.exe',
            'build-tools/35.0.0/zipalign.exe',
            'build-tools/35.0.0/apksigner.bat',
            'build-tools/35.0.0/lib/d8.jar'
          )
          foreach ($relative in $required) {
            $file = Join-Path $env:ANDROID_SDK_ROOT $relative
            if (-not (Test-Path $file)) {
              throw "SDK file missing: $relative. Bump the SDK cache key suffix and rerun."
            }
          }

      # Save before compilation so a later Java/build error doesn't waste SDK setup.
      - name: Save Android SDK cache
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ steps.android-sdk-cache.outputs.cache-primary-key }}

      - name: Set app version for this run
        run: |
          $ErrorActionPreference = 'Stop'
          # A new manual run increments GITHUB_RUN_NUMBER; reruns keep that number.
          # Update both Android manifest fields, not just the APK filename.
          $number = [int]$env:GITHUB_RUN_NUMBER
          $versionName = "1.1.$number"
          $versionCode = 10000 + $number
          $manifestPath = Join-Path $PWD 'AndroidManifest.xml'
          [xml]$manifest = Get-Content $manifestPath -Raw
          $androidNs = 'http://schemas.android.com/apk/res/android'
          [void]$manifest.DocumentElement.SetAttribute('versionName', $androidNs, $versionName)
          [void]$manifest.DocumentElement.SetAttribute('versionCode', $androidNs, [string]$versionCode)
          $manifest.Save($manifestPath)

          $apkName = "WebAuthn-Shell-$versionName.apk"
          "APP_VERSION=$versionName" >> $env:GITHUB_ENV
          "APP_VERSION_CODE=$versionCode" >> $env:GITHUB_ENV
          "APK_FILENAME=$apkName" >> $env:GITHUB_ENV
          "APK_PATH=build/$apkName" >> $env:GITHUB_ENV
          Write-Output "Building version $versionName (versionCode $versionCode)"

      - name: Build and verify APK
        env:
          MODULE_KEYSTORE_B64: ${{ secrets.MODULE_KEYSTORE_B64 }}
          MODULE_KS_PASS: ${{ secrets.MODULE_KS_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { throw 'Android SDK location is missing.' }
          $env:ANDROID_SDK_ROOT = $sdk

          # Adapt the upstream Windows script to the runner SDK location.
          $file = Join-Path $PWD 'build.ps1'
          $script = Get-Content $file -Raw
          $original = '$sdk = "$env:LOCALAPPDATA\Android\Sdk"'
          if (-not $script.Contains($original)) {
            throw 'Unexpected build.ps1 SDK line. Use the original Windows build.ps1.'
          }
          $script = $script.Replace($original, '$sdk = $env:ANDROID_SDK_ROOT')
          # Keep the build script output filename aligned with the manifest version.
          if (-not $script.Contains('WebAuthn-Shell-1.0.0.apk')) {
            throw 'Unexpected APK filename in build.ps1. Update the workflow filename replacement.'
          }
          $script = $script.Replace('WebAuthn-Shell-1.0.0.apk', $env:APK_FILENAME)

          # Recommended LSPosed scope; MainHook.java must also contain these targets.
          $script = $script.Replace(
            '"mark.via.gp","mark.via"',
            '"mark.via.gp","mark.via","com.microsoft.office.outlook","org.swiftapps.swiftbackup"'
          )
          # Read the signing password from the environment, not literal command-line args.
          $script = $script.Replace(
            '--ks-pass "pass:$signPass" --key-pass "pass:$signPass"',
            '--ks-pass env:MODULE_KS_PASS --key-pass env:MODULE_KS_PASS'
          )
          Set-Content -Path $file -Value $script -Encoding utf8

          # Restore the SAME signing identity on every run. No random-key fallback.
          $key = Join-Path $PWD 'module.ks'
          try {
            if ([string]::IsNullOrWhiteSpace($env:MODULE_KEYSTORE_B64) -or
                [string]::IsNullOrWhiteSpace($env:MODULE_KS_PASS)) {
              throw 'Signing secrets are missing.'
            }
            $bytes = [Convert]::FromBase64String($env:MODULE_KEYSTORE_B64)
            [IO.File]::WriteAllBytes($key, $bytes)
            [Array]::Clear($bytes, 0, $bytes.Length)
            Remove-Item Env:MODULE_KEYSTORE_B64 -ErrorAction SilentlyContinue

            # Match the upstream build script's fixed alias and shared key/store password.
            & keytool -list -keystore $key -storetype PKCS12 -storepass:env MODULE_KS_PASS -alias dsh | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw 'Signing keystore/password/alias validation failed. Expected PKCS12 with alias dsh.'
            }
            & $file
            if ($LASTEXITCODE -ne 0) { throw 'APK build failed.' }
            & "$sdk\build-tools\35.0.0\apksigner.bat" verify --verbose --print-certs $env:APK_PATH
            if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed.' }
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
            Remove-Item Env:MODULE_KS_PASS -ErrorAction SilentlyContinue
            Remove-Item Env:MODULE_KEYSTORE_B64 -ErrorAction SilentlyContinue
          }

      - name: Clean up signing material
        if: always()
        run: |
          Remove-Item (Join-Path $PWD 'module.ks') -Force -ErrorAction SilentlyContinue

      - name: Upload APK directly for one day
        id: upload
        uses: actions/upload-artifact@v7
        with:
          # v7 can upload one file directly, without a ZIP wrapper.
          # With archive:false, the APK filename becomes the artifact name.
          path: ${{ env.APK_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Add download link to run summary
        env:
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
          SDK_CACHE_HIT: ${{ steps.android-sdk-cache.outputs.cache-hit }}
        run: |
          "### APK ready" >> $env:GITHUB_STEP_SUMMARY
          "Version: $env:APP_VERSION (versionCode $env:APP_VERSION_CODE)" >> $env:GITHUB_STEP_SUMMARY
          "Android SDK cache hit: $env:SDK_CACHE_HIT" >> $env:GITHUB_STEP_SUMMARY
          "[Download APK]($env:APK_URL) — retained for one day." >> $env:GITHUB_STEP_SUMMARY
          "Signed with your persistent repository-secret key. One uninstall is needed when moving from earlier disposable-key builds; subsequent builds can update in place while this key stays unchanged." >> $env:GITHUB_STEP_SUMMARY
